[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acrdl"
version = "0.1.0"
description = "Automated Code Review and Program Repair System Using Deep Learning: ambiguity-aware assessment of LLM-generated patches"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "pyyaml>=6.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
ml = ["torch>=2.0", "transformers>=4.40", "scikit-learn>=1.3", "scipy>=1.9"]
analysis = ["hypothesis>=6.0", "crosshair-tool>=0.0.60", "mypy>=1.5"]
data = ["datasets>=2.18"]
dev = ["pytest>=7.4", "ruff>=0.4"]
report = ["matplotlib>=3.7"]
all = ["acrdl[ml,analysis,data,dev,report]"]

[project.scripts]
acrdl = "acrdl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acrdl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Converting a tensor with requires_grad=True to a scalar:UserWarning",
    "ignore:urllib3 v2 only supports OpenSSL:Warning",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["UP007", "UP045"]
